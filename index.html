<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>パチンコシミュレーター（リゼロ鬼がかり2）</title>
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body>
  <div id="app">

    <div id="title-bar">パチンコ　リゼロ鬼がかり2</div>

    <div id="header">

      <div class="hrow hrow1">
        <div class="spins-block">
          <span class="spins-current" id="current-spins">0</span>
          <span class="spins-unit">回</span>
          <span class="spins-sep">／累計</span>
          <span class="spins-total" id="total-spins-disp">0</span>
          <span class="spins-unit">回</span>
        </div>
        <div id="mode-badge">通常時</div>
        <div class="esup-block">
          <div class="esup-label">ST残り</div>
          <div class="esup-value" id="rush-count">－</div>
        </div>
      </div>

      <div class="hrow hrow2">
        <div class="money-block">
          <span class="money-label">持ち球</span>
          <span class="money-value gold" id="mochi-dama">0</span>
          <span class="money-unit">球</span>
        </div>
        <div class="money-block">
          <span class="money-label">投資</span>
          <span class="money-value red" id="toushi-value">0</span>
          <span class="money-unit">円</span>
        </div>
        <div class="money-block">
          <span class="money-label">収支</span>
          <span class="money-value red" id="shuushi-value">0</span>
          <span class="money-unit">円</span>
        </div>
      </div>

      <div class="hrow hrow3">
        <div class="hrow3-header">
          <span class="hrow3-title">大当たり総回数</span>
          <span class="total-hit-block">
            <span class="total-hit-count" id="total-hit-count">0回</span>
          </span>
          <span class="fee-block" id="fee-block">16回転/千円</span>
        </div>
        <div class="hrow3-normal-line">
          <span class="hit-label2">通常時初当たり</span>
          <span class="hit-count" id="normal-first-hit">0回</span>
          <span class="hit-prob" id="normal-first-prob">1/―</span>
        </div>
        <div class="hrow3-stats">
          <div class="hit-item">
            <span class="hit-label2">RUSH突入</span>
            <span class="hit-count" id="rush-entry-count">0回</span>
            <span class="rush-entry" id="rush-entry-rate">(突入率―%)</span>
          </div>
          <div class="hit-item">
            <span class="hit-label2">単発</span>
            <span class="hit-count" id="single-count">0回</span>
          </div>
        </div>
      </div>

    </div><!-- /header -->

    <div id="main-screen"></div>

    <div id="rush-stats-bar">
      <div class="rsb-header">
        <span class="rsb-title">通算RUSH成績</span>
        <span class="rsb-item">
          <span class="rsb-label">大当たり</span>
          <span class="rsb-val" id="rs-chain">0回</span>
          <span class="rsb-prob" id="rs-prob">1/―</span>
        </span>
        <span class="rsb-item">
          <span class="rsb-label">総回転</span>
          <span class="rsb-val" id="rs-spins">0回</span>
        </span>
      </div>
      <div class="rsb-row">
        <span class="rsb-item"><span class="rsb-label">6000</span><span class="rsb-val" id="rs-6000">0回</span></span>
        <span class="rsb-item"><span class="rsb-label">1500</span><span class="rsb-val" id="rs-1500">0回</span></span>
        <span class="rsb-item"><span class="rsb-label">300</span><span class="rsb-val" id="rs-300">0回</span></span>
        <span class="rsb-item"><span class="rsb-label">リスタート</span><span class="rsb-val" id="rs-restart">0回</span></span>
      </div>
    </div>

    <div id="log-area">
      <div id="log-title">履歴</div>
      <div id="log-list"></div>
    </div>

    <!-- 大当たり履歴グラフ：1ブロック=100回転、700回転以上は7ブロック＋▲。左が新しく、横スクロールで過去へ -->
    <div id="hist-area">
      <div class="hist-title"><span>大当たり履歴（1ブロック=100回転）</span><span>← 新しい ｜ 過去 →</span></div>
      <div class="hist-body">
        <div class="hist-axis"><span>0</span><span>100</span><span>200</span><span>300</span><span>400</span><span>500</span><span>600</span><span>700</span></div>
        <div class="hist-scroll"><div class="hist-cols" id="hist-cols"></div></div>
      </div>
    </div>

    <!-- 差玉推移グラフ：横軸=総回転数、縦軸=差玉（持ち玉−投資玉） -->
    <div id="slump-area">
      <div class="slump-title"><span>差玉推移（1000円=250玉）</span><span id="slump-now"></span></div>
      <svg id="slump-svg" viewBox="0 0 360 170" preserveAspectRatio="none"></svg>
    </div>


    <!-- 鬼がかり予告：上を見ながら画面を横切る鬼の女の子（オリジナル） -->
    <div id="oni-walker" aria-hidden="true">
      <svg viewBox="0 0 80 110" width="116" height="160">
        <g class="oni-body">
          <!-- 脚 -->
          <g class="oni-leg oni-leg-back"><rect x="34" y="80" width="7" height="20" rx="3" fill="#f3d2b8"/><rect x="32" y="98" width="11" height="5" rx="2" fill="#5a2b1b"/></g>
          <g class="oni-leg oni-leg-front"><rect x="41" y="80" width="7" height="20" rx="3" fill="#f7dcc4"/><rect x="39" y="98" width="11" height="5" rx="2" fill="#6b3322"/></g>
          <!-- 首 -->
          <rect x="36.5" y="42" width="7" height="14" rx="2" fill="#f3d2b8"/>
          <!-- 着物 -->
          <path d="M27 54 Q40 48 53 54 L57 84 Q40 89 23 84 Z" fill="#c62828"/>
          <path d="M33 54 L40 66 L47 54" fill="none" stroke="#fff" stroke-width="3"/>
          <rect x="25" y="68" width="30" height="5" fill="#ffd54f"/>
          <!-- 腕 -->
          <g class="oni-arm"><rect x="50" y="56" width="7" height="18" rx="3" fill="#b71c1c" transform="rotate(-12 53 56)"/></g>
          <!-- 頭（上を見る） -->
          <g transform="rotate(-18 40 34)">
            <ellipse cx="40" cy="22" rx="10" ry="8" fill="#1d1414"/>
            <circle cx="40" cy="32" r="15" fill="#f9e0cb"/>
            <path d="M25 30 Q26 14 40 14 Q55 14 55 30 Q50 22 40 22 Q30 22 25 30 Z" fill="#1d1414"/>
            <path d="M25 30 Q23 42 27 48 L29 34 Z" fill="#1d1414"/>
            <path d="M55 30 Q57 42 53 48 L51 34 Z" fill="#1d1414"/>
            <!-- 1本角 -->
            <path d="M38 16 L41 3 L44 16 Z" fill="#e53935" stroke="#7f0000" stroke-width="0.8"/>
            <!-- 目（上向き） -->
            <ellipse cx="34" cy="31" rx="2.6" ry="3.2" fill="#3b1f1f"/><circle cx="34.6" cy="29.6" r="1" fill="#fff"/>
            <ellipse cx="46" cy="31" rx="2.6" ry="3.2" fill="#3b1f1f"/><circle cx="46.6" cy="29.6" r="1" fill="#fff"/>
            <ellipse cx="30" cy="37" rx="2.5" ry="1.4" fill="#ff9e9e" opacity="0.7"/>
            <ellipse cx="50" cy="37" rx="2.5" ry="1.4" fill="#ff9e9e" opacity="0.7"/>
            <path d="M38 40 Q40 42 42 40" fill="none" stroke="#8a3b3b" stroke-width="1.2" stroke-linecap="round"/>
          </g>
        </g>
      </svg>
    </div>

    <!-- 6000ボーナス：レインボー演出 -->
    <div id="rainbow-6000">
      <div class="r6-rays"></div>
      <div class="r6-glow"></div>
      <div class="r6-sparks"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="r6-stage">
        <div class="r6-oni" id="rainbow-6000-oni">
          <span class="r6-depth">鬼がかり</span><span class="r6-face">鬼がかり</span><span class="r6-shine">鬼がかり</span>
        </div>
        <div class="r6-num" id="rainbow-6000-num">
          <span class="r6-depth">6</span><span class="r6-face">6</span><span class="r6-shine">6</span>
        </div>
      </div>
    </div>

    <div id="tv-off-flash">
      <div class="cross-bar horizontal"></div>
      <div class="cross-bar vertical"></div>
    </div>

  </div>
  <script src="logic.js?v=15"></script>
  <script src="script.js?v=15"></script>
  <script src="https://wwi195.github.io/site-analytics/tracker.js?v=6" data-site-id="pachinko-simulator-kishin2"></script>
</body>
</html>
